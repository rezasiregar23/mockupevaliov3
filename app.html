<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aplikasi — EVALIO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="assets/css/app-card.css" />
  <link rel="stylesheet" href="assets/css/workspace.css" />
  <script src="assets/js/apps.js"></script>
  <script src="assets/js/app-data.js"></script>
  <script src="assets/js/app-card.js"></script>
  <script src="assets/js/shell.js"></script>
</head>
<body class="bg-page font-sans leading-[normal] text-ink antialiased">
  <div class="flex min-h-screen flex-col">
    <div id="shell-header"></div>

    <!-- App hero -->
    <section class="ws-hero">
      <span id="hero-motif" class="ws-hero__motif hidden lg:block" aria-hidden="true"></span>
      <div class="relative mx-auto flex max-w-[1440px] flex-col items-start gap-4 px-4 pb-8 pt-8 md:px-8 xl:px-[120px]">
        <nav aria-label="Breadcrumb" class="flex items-center gap-2">
          <img src="assets/icons/icon-grid-14.svg" alt="" width="14" height="14" />
          <a href="index.html" class="whitespace-nowrap text-xs font-semibold text-ink-muted hover:text-brand">EVALIO Portal</a>
          <img src="assets/icons/icon-chev-right.svg" alt="" width="14" height="14" />
          <span aria-current="page" data-app-name class="whitespace-nowrap text-xs font-bold text-[var(--c-tile)]"></span>
        </nav>

        <div class="flex items-center gap-4">
          <span class="ws-tile size-16 rounded-[18px]"><img data-app-icon src="" alt="" width="30" height="30" class="size-[30px]" /></span>
          <div class="flex flex-col gap-1.5">
            <div class="flex flex-wrap items-center gap-2.5">
              <h1 data-app-name class="text-[30px] font-extrabold leading-9 tracking-[-0.448px] text-ink-strong md:text-[32px]"></h1>
              <span id="hero-tag" class="ws-tag"></span>
            </div>
            <p data-app-desc class="text-sm font-medium text-ink-body"></p>
          </div>
        </div>

        <div id="hero-stats" class="flex flex-wrap gap-2"></div>

        <div class="flex w-full flex-wrap items-center gap-3">
          <label class="flex h-[50px] w-full max-w-[560px] items-center gap-3 rounded-[14px] border border-line bg-white pl-[18px] pr-2.5 shadow-search-sm transition focus-within:border-[var(--c-motif)]">
            <img src="assets/icons/icon-search-18.svg" alt="" width="18" height="18" />
            <input id="search" type="search" autocomplete="off" class="min-w-0 flex-1 bg-transparent text-sm text-ink outline-none placeholder:text-ink-muted" />
          </label>
          <a id="sso-link" href="#" target="_blank" rel="noopener" class="md-btn md-btn--primary hidden h-[50px] rounded-[14px] px-5">
            Buka via SSO
            <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
          </a>
        </div>
      </div>
    </section>

    <!-- Features -->
    <main class="mx-auto flex w-full max-w-[1440px] flex-1 flex-col items-start gap-7 px-4 pb-[60px] pt-6 md:px-8 xl:px-[120px]">
      <div id="tabs" role="tablist" aria-label="Kategori fitur" class="flex max-w-full gap-1 overflow-x-auto rounded-xl border border-line bg-white p-1"></div>
      <div id="groups" class="flex w-full flex-col gap-7"></div>
      <p id="empty-state" class="hidden w-full rounded-2xl border border-line bg-white px-5 py-8 text-center text-sm text-ink-body">
        Tidak ada fitur yang cocok dengan pencarian Anda.
      </p>
    </main>

    <div id="shell-footer"></div>
  </div>

  <script>const APP = mountShell();</script>

  <style type="text/tailwindcss">
    .dd-panel {
      @apply absolute top-full z-40 mt-2 overflow-hidden rounded-2xl border border-line bg-white shadow-pop animate-pop-in max-sm:fixed max-sm:inset-x-4 max-sm:top-[76px] max-sm:w-auto;
    }
  </style>

  <script src="assets/js/ui.js"></script>
  <script>
    const WS = WORKSPACES[APP.id];
    const state = { tab: 'all', query: '' };
    const ARROW = '<svg class="size-4" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.333 8h9.334M8 12.667 12.667 8 8 3.333" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    document.title = `${APP.name} — EVALIO`;
    document.getElementById('hero-motif').innerHTML = MOTIFS[APP.category] || '';
    document.getElementById('hero-tag').textContent = CATEGORIES[APP.category]?.label || '';
    document.getElementById('hero-stats').innerHTML = WS.stats
      .map(([value, label]) => `<span class="ws-stat"><b>${value}</b><span>${label}</span></span>`).join('');
    document.getElementById('search').placeholder = `Cari fitur di ${APP.name}...`;
    if (APP.ssoUrl) {
      const sso = document.getElementById('sso-link');
      sso.href = APP.ssoUrl;
      sso.classList.remove('hidden');
      sso.firstChild.textContent = `Buka ${APP.name} (SSO) `;
    }

    // Tabs: "Semua Fitur" + every tab this app actually uses, in a fixed order.
    const usedTabs = Object.keys(WORKSPACE_TABS).filter(t => WS.groups.some(g => g.features.some(ft => ft.tab === t)));
    document.getElementById('tabs').innerHTML = [['all', 'Semua Fitur'], ...usedTabs.map(t => [t, WORKSPACE_TABS[t]])]
      .map(([id, label]) => `<button type="button" role="tab" data-tab="${id}" class="ws-tab">${label}</button>`).join('');

    function featureHTML(ft, primary) {
      return `
        <a href="${moduleUrl(APP.id, ft.module)}" title="${ft.name} — ${ft.desc}" class="ws-feature animate-fade-in${primary ? ' is-primary' : ''}">
          <span class="ws-feature__icon"><span class="ws-icon" style="--icon:${iconURL(ft.icon)}"></span></span>
          <span class="flex min-w-0 flex-1 flex-col gap-1">
            <span class="ws-feature__title">${ft.name}</span>
            <span class="ws-feature__desc">${ft.desc}</span>
          </span>
          <span class="ws-feature__go">${ARROW}</span>
        </a>`;
    }

    function render() {
      const q = state.query.trim().toLowerCase();
      const html = WS.groups.map((g, gi) => {
        const items = g.features.filter(ft =>
          (state.tab === 'all' || ft.tab === state.tab) &&
          (!q || `${ft.name} ${ft.desc}`.toLowerCase().includes(q)));
        if (!items.length) return '';
        return `
          <section class="flex flex-col gap-3.5">
            <div class="flex items-center gap-2.5">
              <h2 class="text-base font-extrabold tracking-[-0.064px] text-ink">${g.title}</h2>
              <span class="rounded-full bg-[var(--c-tag-bg)] px-[7px] py-px text-[11px] font-bold text-[var(--c-tag)]">${items.length}</span>
            </div>
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
              ${items.map(ft => featureHTML(ft, gi === 0 && ft === WS.groups[0].features[0])).join('')}
            </div>
          </section>`;
      }).join('');
      document.getElementById('groups').innerHTML = html;
      document.getElementById('empty-state').classList.toggle('hidden', html !== '');
      document.querySelectorAll('[data-tab]').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === state.tab)));
    }

    document.getElementById('tabs').addEventListener('click', e => {
      const tab = e.target.closest('[data-tab]');
      if (!tab) return;
      state.tab = tab.dataset.tab;
      render();
    });
    const search = document.getElementById('search');
    search.addEventListener('input', () => { state.query = search.value; render(); });

    render();
  </script>
</body>
</html>
